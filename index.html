<script>
// ==========================================
// GLOBAL STATE & CONFIGURATION
// ==========================================
const state = {
  user: null,
  balance: 0,
  bets: [],
  history: [],
  format: 'decimal',
  currentSport: 'all',
  vipPoints: 0,
  vipLevel: 1,
  audio: true,
  matches: [],
  virtualMatches: [],
  aviator: {
    flying: false,
    multiplier: 1.00,
    crashed: false,
    bets: [{active: false, amount: 0, cashed: false}, {active: false, amount: 0, cashed: false}],
    history: [],
    curve: [],
    startTime: 0
  }
};

const vipTiers = [
  {level: 1, name: 'Bronze', min: 0, max: 1000, cashback: 0.05},
  {level: 2, name: 'Silver', min: 1001, max: 5000, cashback: 0.07},
  {level: 3, name: 'Gold', min: 5001, max: 20000, cashback: 0.10},
  {level: 4, name: 'Platinum', min: 20001, max: 50000, cashback: 0.15},
  {level: 5, name: 'Diamond', min: 50001, max: Infinity, cashback: 0.20}
];

// ==========================================
// MATCH DATA GENERATOR
// ==========================================
const teams = {
  football: [
    ['Manchester United', 'Liverpool', 'Manchester City', 'Chelsea', 'Arsenal', 'Tottenham', 'Barcelona', 'Real Madrid', 'Atletico Madrid', 'Bayern Munich', 'Borussia Dortmund', 'PSG', 'Juventus', 'AC Milan', 'Inter Milan', 'Ajax', 'Porto', 'Benfica', 'Napoli', 'Roma'],
    ['Leicester City', 'West Ham', 'Everton', 'Aston Villa', 'Newcastle', 'Wolves', 'Sevilla', 'Villarreal', 'Real Betis', 'RB Leipzig', 'Leverkusen', 'Marseille', 'Lyon', 'Lazio', 'Atalanta', 'Sporting CP', 'Celtic', 'Rangers', 'Feyenoord', 'PSV']
  ],
  basketball: [
    ['Lakers', 'Warriors', 'Celtics', 'Bulls', 'Heat', 'Nets', 'Suns', 'Bucks', '76ers', 'Mavericks'],
    ['Knicks', 'Clippers', 'Nuggets', 'Raptors', 'Hawks', 'Jazz', 'Trail Blazers', 'Kings', 'Pacers', 'Pistons']
  ],
  tennis: [
    ['Novak Djokovic', 'Carlos Alcaraz', 'Jannik Sinner', 'Daniil Medvedev', 'Alexander Zverev', 'Rafael Nadal'],
    ['Stefanos Tsitsipas', 'Andrey Rublev', 'Casper Ruud', 'Holger Rune', 'Taylor Fritz', 'Matteo Berrettini']
  ],
  cricket: [
    ['India', 'Australia', 'England', 'Pakistan', 'South Africa', 'New Zealand'],
    ['West Indies', 'Sri Lanka', 'Bangladesh', 'Afghanistan', 'Zimbabwe', 'Ireland']
  ],
  rugby: [
    ['New Zealand', 'South Africa', 'England', 'Ireland', 'France', 'Wales'],
    ['Australia', 'Scotland', 'Argentina', 'Japan', 'Samoa', 'Fiji']
  ],
  esports: [
    ['FaZe Clan', 'NAVI', 'G2 Esports', 'Team Liquid', 'Cloud9', 'Fnatic', 'Vitality', 'Astralis'],
    ['NiP', 'Mousesports', 'FURIA', 'EG', '100 Thieves', 'TSM', 'MAD Lions', 'Heroic']
  ]
};

const leagues = {
  football: ['Premier League', 'La Liga', 'Bundesliga', 'Serie A', 'Ligue 1', 'Champions League'],
  basketball: ['NBA', 'EuroLeague'],
  tennis: ['ATP Tour', 'Grand Slam'],
  cricket: ['Test Match', 'ODI', 'T20'],
  rugby: ['Rugby World Cup', 'Six Nations'],
  esports: ['CS:GO Major', 'Dota 2 TI', 'LoL Worlds']
};

// ==========================================
// INITIALIZATION
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
  loadUser();
  generateMatches();
  generateVirtualMatches();
  renderMatches();
  renderVirtualMatches();
  updateVIP();
  startMatchSimulation();
  updateJackpot();
  setInterval(updateJackpot, 3000);
});

function loadUser() {
  const saved = localStorage.getItem('treasureBetUser');
  if (saved) {
    const data = JSON.parse(saved);
    state.user = data.user;
    state.balance = Math.max(0, data.balance || 0);
    state.vipPoints = data.vipPoints || 0;
    state.vipLevel = data.vipLevel || 1;
    state.history = data.history || [];
    updateUI();
  }
}

function saveUser() {
  if (state.user) {
    localStorage.setItem('treasureBetUser', JSON.stringify({
      user: state.user,
      balance: state.balance,
      vipPoints: state.vipPoints,
      vipLevel: state.vipLevel,
      history: state.history
    }));
  }
}

// ==========================================
// MATCH GENERATION & MANAGEMENT
// ==========================================
function generateMatches() {
  state.matches = [];
  const sports = ['football', 'basketball', 'tennis', 'cricket', 'rugby', 'esports'];
  
  sports.forEach(sport => {
    const count = sport === 'football' ? 12 : 4;
    for (let i = 0; i < count; i++) {
      createMatch(sport);
    }
  });
}

function createMatch(sport, isLive = true) {
  const tier1 = teams[sport][0];
  const tier2 = teams[sport][1];
  const home = Math.random() > 0.3 ? tier1[Math.floor(Math.random() * tier1.length)] : tier2[Math.floor(Math.random() * tier2.length)];
  let away = Math.random() > 0.3 ? tier1[Math.floor(Math.random() * tier1.length)] : tier2[Math.floor(Math.random() * tier2.length)];
  while (away === home) {
    away = Math.random() > 0.3 ? tier1[Math.floor(Math.random() * tier1.length)] : tier2[Math.floor(Math.random() * tier2.length)];
  }
  
  const baseOdds = generateOdds();
  const match = {
    id: 'M' + Date.now() + Math.random().toString(36).substr(2, 9),
    sport,
    league: leagues[sport][Math.floor(Math.random() * leagues[sport].length)],
    home,
    away,
    odds: baseOdds,
    isLive: true, // Always live
    status: 'live',
    time: 0, // Start from 0
    score: {home: 0, away: 0}, // Start 0-0
    stats: {possession: 50, homeAtt: 0, awayAtt: 0},
    halfTime: false,
    fullTime: false,
    startTime: Date.now(), // Start now
    halfTimeStart: null,
    secondHalfStart: null
  };
  
  state.matches.push(match);
  return match;
}

function generateOdds() {
  const home = (Math.random() * 3 + 1.2).toFixed(2);
  const draw = (Math.random() * 2 + 2.5).toFixed(2);
  const away = (Math.random() * 3 + 1.5).toFixed(2);
  return {home: parseFloat(home), draw: parseFloat(draw), away: parseFloat(away)};
}

function generateVirtualMatches() {
  state.virtualMatches = [];
  for (let i = 0; i < 4; i++) {
    const match = createMatch('football', true);
    match.isVirtual = true;
    match.time = Math.floor(Math.random() * 3);
    state.virtualMatches.push(match);
  }
}

// ==========================================
// MATCH SIMULATION ENGINE - 3 MINUTE MATCHES
// ==========================================
function startMatchSimulation() {
  setInterval(() => {
    updateMatches();
  }, 1000); // Update every second
}

function updateMatches() {
  const now = Date.now();
  
  state.matches.forEach(match => {
    if (match.fullTime) return;
    
    const elapsed = (now - match.startTime) / 1000; // seconds (not minutes)
    
    // FIRST HALF (0 - 90 seconds)
    if (match.isLive && !match.halfTime) {
      match.time = Math.min(90, Math.floor(elapsed));
      
      // Realistic goal chance - 3% per second = ~2-3 goals per half
      if (Math.random() < 0.03) {
        if (Math.random() > 0.5) match.score.home++;
        else match.score.away++;
        showToast('⚽ GOAL!', `${match.home} ${match.score.home} - ${match.score.away} ${match.away}`);
      }
      
      // Half time at exactly 90 seconds
      if (match.time >= 90) {
        match.halfTime = true;
        match.status = 'HT';
        match.halfTimeStart = now; // Record when half-time started
        showToast('⏸️ HALF TIME', `${match.home} ${match.score.home} - ${match.score.away} ${match.away}`);
      }
    } 
    // HALF-TIME BREAK (10 seconds)
    else if (match.halfTime && !match.fullTime) {
      const halfTimeElapsed = (now - match.halfTimeStart) / 1000;
      
      if (halfTimeElapsed >= 10) { // 10 second break
        match.halfTime = false;
        match.isLive = true;
        match.status = 'live';
        match.secondHalfStart = now; // Record second half start
        showToast('▶️ SECOND HALF', `${match.home} vs ${match.away} resumed!`);
      }
    } 
    // SECOND HALF (90 - 180 seconds)
    else if (match.isLive && !match.halfTime && match.secondHalfStart) {
      const secondHalfElapsed = (now - match.secondHalfStart) / 1000;
      match.time = Math.min(180, 90 + Math.floor(secondHalfElapsed));
      
      // Realistic goal chance in second half - slightly higher for drama
      if (Math.random() < 0.035) {
        if (Math.random() > 0.5) match.score.home++;
        else match.score.away++;
        showToast('⚽ GOAL!', `${match.home} ${match.score.home} - ${match.score.away} ${match.away}`);
      }
      
      // Full time at exactly 180 seconds (3 minutes total)
      if (match.time >= 180) {
        match.fullTime = true;
        match.status = 'FT';
        match.isLive = false;
        
        // CHECK BETS IMMEDIATELY
        checkBetResults(match);
        
        showToast('🏁 FULL TIME', `${match.home} ${match.score.home} - ${match.score.away} ${match.away}`);
        
        // Replace with new match after 5 seconds
        setTimeout(() => {
          const idx = state.matches.indexOf(match);
          if (idx > -1) {
            state.matches.splice(idx, 1);
            state.matches.push(createMatch(match.sport, true));
            renderMatches();
          }
        }, 5000);
      }
    }
    
    // Update stats for live matches
    if (match.isLive && !match.halfTime && !match.fullTime) {
      match.stats.possession = 50 + Math.floor(Math.random() * 20 - 10);
      match.stats.homeAtt += Math.floor(Math.random() * 2);
      match.stats.awayAtt += Math.floor(Math.random() * 2);
    }
  });
  
  renderMatches();
  updateBetslip();
  renderHistory();
  renderMyBets();
}
function checkBetResults(match) {
  let anyBetUpdated = false;
  
  state.history.forEach(bet => {
    if (bet.status !== 'pending') return;
    
    // Check if this bet includes the finished match
    const hasThisMatch = bet.selections.some(s => s.matchId === match.id);
    if (!hasThisMatch) return;
    
    // Find the specific selection for this match
    const matchSelection = bet.selections.find(s => s.matchId === match.id);
    if (!matchSelection) return;
    
    // Determine if this selection won
    let selectionWon = false;
    if (matchSelection.selection === match.home && match.score.home > match.score.away) {
      selectionWon = true;
    } else if (matchSelection.selection === match.away && match.score.away > match.score.home) {
      selectionWon = true;
    } else if (matchSelection.selection === 'Draw' && match.score.home === match.score.away) {
      selectionWon = true;
    }
    
    // For single bets - update immediately
    if (bet.selections.length === 1) {
      if (selectionWon) {
        bet.status = 'won';
        state.balance += bet.potentialWin;
        anyBetUpdated = true;
        showToast('🎉🎉 BET WON!', `You won ₦${bet.potentialWin.toFixed(2)}! Added to balance!`);
      } else {
        bet.status = 'lost';
        anyBetUpdated = true;
        showToast('❌ BET LOST', `You lost ₦${bet.stake.toFixed(2)}. Better luck next time!`);
      }
    } 
    // For accumulators - check if all matches are done
    else {
      // Check if all matches in accumulator are finished
      const allMatchesDone = bet.selections.every(s => {
        const m = state.matches.find(m => m.id === s.matchId);
        return !m || m.fullTime;
      });
      
      if (allMatchesDone) {
        // Check if all selections won
        const allWon = bet.selections.every(s => {
          const m = state.matches.find(m => m.id === s.matchId);
          if (!m) return false;
          if (s.selection === m.home && m.score.home > m.score.away) return true;
          if (s.selection === m.away && m.score.away > m.score.home) return true;
          if (s.selection === 'Draw' && m.score.home === m.score.away) return true;
          return false;
        });
        
        if (allWon) {
          bet.status = 'won';
          state.balance += bet.potentialWin;
          anyBetUpdated = true;
          showToast('🎉🎉 ACCA WON!', `You won ₦${bet.potentialWin.toFixed(2)}! All ${bet.selections.length} picks correct!`);
        } else {
          bet.status = 'lost';
          anyBetUpdated = true;
          showToast('❌ ACCA LOST', `One or more picks failed. Lost ₦${bet.stake.toFixed(2)}`);
        }
      }
    }
    
    // Update VIP points
    if (bet.status !== 'pending') {
      state.vipPoints += bet.status === 'won' ? Math.floor(bet.potentialWin / 100) : Math.floor(bet.stake / 50);
      updateVIP();
    }
  });
  
  if (anyBetUpdated) {
    saveUser();
    updateUI();
    renderHistory();
    renderMyBets();
  }
}

// ==========================================
// RENDERING
// ==========================================
function renderMatches() {
  const container = document.getElementById('matchList');
  if (!container) return;
  
  let filtered = state.currentSport === 'all' ? state.matches : state.matches.filter(m => m.sport === state.currentSport);
  
  container.innerHTML = filtered.map(match => {
    const fmt = state.format;
    const hOdds = fmt === 'fractional' ? decimalToFrac(match.odds.home) : fmt === 'american' ? decimalToAmer(match.odds.home) : match.odds.home;
    const dOdds = fmt === 'fractional' ? decimalToFrac(match.odds.draw) : fmt === 'american' ? decimalToAmer(match.odds.draw) : match.odds.draw;
    const aOdds = fmt === 'fractional' ? decimalToFrac(match.odds.away) : fmt === 'american' ? decimalToAmer(match.odds.away) : match.odds.away;
    
    const isLive = match.isLive && !match.halfTime && !match.fullTime;
    const isHT = match.halfTime;
    const isFT = match.fullTime;
    
    // Time display
    let timeDisplay = '';
    if (isLive) {
      timeDisplay = `${Math.floor(match.time * 60)}'`;
    } else if (isHT) {
      timeDisplay = 'HT';
    } else if (isFT) {
      timeDisplay = 'FT';
    } else {
      timeDisplay = formatTime(match.time);
    }
    
    return `
      <div class="mc ${isLive ? 'lv' : ''} ${isHT ? 'ht' : ''} ${isFT ? 'ft' : ''}">
        <div class="mch">
          <div class="mcl">
            <div class="ld2">${match.sport[0].toUpperCase()}</div>
            <span>${match.league}</span>
            ${isLive ? '<span style="color:var(--red);font-weight:700;background:rgba(239,68,68,0.15);padding:2px 6px;border-radius:4px;">● LIVE</span>' : ''}
            ${isHT ? '<span style="color:var(--g);font-weight:700;background:rgba(245,197,24,0.15);padding:2px 6px;border-radius:4px;">HT</span>' : ''}
            ${isFT ? '<span style="color:var(--blue);font-weight:700;background:rgba(59,130,246,0.15);padding:2px 6px;border-radius:4px;">FT</span>' : ''}
          </div>
          <div style="display:flex;gap:.5rem;align-items:center;">
            <span class="scr" style="${isLive ? 'color:var(--red);' : isFT ? 'color:var(--blue);' : ''}">${match.score.home} - ${match.score.away}</span>
            <span style="font-size:0.7rem;color:var(--t3);font-weight:600;">${timeDisplay}</span>
            <button class="ms2 ${isFav(match.id) ? 'on' : ''}" onclick="toggleFav('${match.id}')">
              <i class="${isFav(match.id) ? 'fas' : 'far'} fa-star"></i>
            </button>
          </div>
        </div>
        <div class="mts">
          <div class="tm"><div class="tb">${match.home.substring(0,3).toUpperCase()}</div><span class="tn">${match.home}</span></div>
          <span class="vs">VS</span>
          <div class="tm aw"><div class="tb">${match.away.substring(0,3).toUpperCase()}</div><span class="tn">${match.away}</span></div>
        </div>
        <div class="or">
          <button class="op ${isSelected(match.id, 'home') ? 'sl' : ''} ${isFT ? 'locked' : ''}" onclick="addBet('${match.id}', 'home', ${match.odds.home})">
            <div class="ol">1</div><div class="ov">${hOdds}</div>
          </button>
          <button class="op ${isSelected(match.id, 'draw') ? 'sl' : ''} ${isFT ? 'locked' : ''}" onclick="addBet('${match.id}', 'draw', ${match.odds.draw})">
            <div class="ol">X</div><div class="ov">${dOdds}</div>
          </button>
          <button class="op ${isSelected(match.id, 'away') ? 'sl' : ''} ${isFT ? 'locked' : ''}" onclick="addBet('${match.id}', 'away', ${match.odds.away})">
            <div class="ol">2</div><div class="ov">${aOdds}</div>
          </button>
        </div>
        ${isLive ? `
        <div class="stp open">
          <div class="sg">
            <div><div class="sv">${match.stats.possession}%</div><div class="sl2">Possession</div></div>
            <div><div class="sv">${match.stats.homeAtt}</div><div class="sl2">${match.home} Attacks</div></div>
            <div><div class="sv">${match.stats.awayAtt}</div><div class="sl2">${match.away} Attacks</div></div>
          </div>
        </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function renderVirtualMatches() {
  const container = document.getElementById('vmatches');
  if (!container) return;
  
  container.innerHTML = state.virtualMatches.map(match => `
    <div class="vm">
      <span class="vt">LIVE</span>
      <div class="mch" style="margin-bottom:.5rem">
        <span style="font-size:.75rem;color:var(--t3)">Virtual League</span>
        <span class="scr">${match.time.toFixed(0)}' ${match.score.home}-${match.score.away}</span>
      </div>
      <div class="mts" style="margin-bottom:.5rem">
        <div class="tm"><span class="tn">${match.home}</span></div>
        <span style="color:var(--t3)">vs</span>
        <div class="tm aw"><span class="tn">${match.away}</span></div>
      </div>
      <div class="or">
        <button class="op" onclick="addBet('${match.id}', 'home', ${match.odds.home})"><div class="ov">${match.odds.home}</div></button>
        <button class="op" onclick="addBet('${match.id}', 'draw', ${match.odds.draw})"><div class="ov">${match.odds.draw}</div></button>
        <button class="op" onclick="addBet('${match.id}', 'away', ${match.odds.away})"><div class="ov">${match.odds.away}</div></button>
      </div>
    </div>
  `).join('');
}

function formatTime(minutes) {
  const hrs = Math.floor(minutes / 60);
  const mins = Math.floor(minutes % 60);
  const date = new Date();
  date.setHours(date.getHours() + hrs);
  date.setMinutes(date.getMinutes() + mins);
  return date.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
}

// ==========================================
// BETTING SYSTEM
// ==========================================
function addBet(matchId, selection, odds) {
  const match = state.matches.find(m => m.id === matchId) || state.virtualMatches.find(m => m.id === matchId);
  if (!match) {
    showToast('Error', 'Match not found');
    return;
  }
  if (match.fullTime) {
    showToast('Error', 'Match already ended!');
    return;
  }
  
  // Remove existing bet on this match
  state.bets = state.bets.filter(b => b.matchId !== matchId);
  
  const selectionName = selection === 'home' ? match.home : selection === 'away' ? match.away : 'Draw';
  
  state.bets.push({
    matchId: match.id,
    match: `${match.home} vs ${match.away}`,
    selection: selectionName,
    odds: parseFloat(odds),
    sport: match.sport
  });
  
  updateBetslip();
  showToast('✅ Bet Added', `${match.home} vs ${match.away} - ${selectionName} @ ${odds}`);
}

function isSelected(matchId, selection) {
  const selName = selection === 'home' ? 'home' : selection === 'away' ? 'away' : 'Draw';
  return state.bets.some(b => b.matchId === matchId && b.selection === selName);
}

function updateBetslip() {
  const container = document.getElementById('bsCont');
  const stakeDiv = document.getElementById('bsStake');
  const countBadge = document.getElementById('bsCount');
  const bhi = document.getElementById('bhi');
  
  countBadge.textContent = state.bets.length;
  
  if (state.bets.length === 0) {
    container.innerHTML = '<div class="be"><i class="fas fa-ticket-alt"></i><p>Your betslip is empty</p><small>Click any odds to add</small></div>';
    stakeDiv.style.display = 'none';
    bhi.classList.remove('on');
  } else {
    container.innerHTML = '<div class="bbs">' + state.bets.map((bet, idx) => `
      <div class="bb">
        <button class="brm" onclick="removeBet(${idx})"><i class="fas fa-times"></i></button>
        <div class="bm">${bet.match}</div>
        <div class="bse">${bet.selection}</div>
        <div class="bod">@ ${bet.odds}</div>
      </div>
    `).join('') + '</div>';
    stakeDiv.style.display = 'block';
    bhi.classList.add('on');
  }
  
  calcWin();
}

function removeBet(idx) {
  state.bets.splice(idx, 1);
  updateBetslip();
}

function clearBets() {
  state.bets = [];
  updateBetslip();
}

function setStake(amt) {
  document.getElementById('stakeIn').value = amt;
  calcWin();
}

function calcWin() {
  const stake = parseFloat(document.getElementById('stakeIn').value) || 0;
  if (state.bets.length === 0) {
    document.getElementById('pWin').textContent = '₦0.00';
    return;
  }
  
  const totalOdds = state.bets.reduce((acc, bet) => acc * bet.odds, 1);
  const win = stake * totalOdds;
  document.getElementById('pWin').textContent = '₦' + win.toLocaleString('en-NG', {minimumFractionDigits: 2});
}

function openPayModal() {
  if (!state.user) {
    openModal('loginModal');
    return;
  }
  const stake = parseFloat(document.getElementById('stakeIn').value) || 0;
  if (stake < 100) {
    showToast('Error', 'Minimum stake is ₦100');
    return;
  }
  if (stake > state.balance) {
    showToast('Error', 'Insufficient balance');
    openModal('depModal');
    return;
  }
  placeBet(stake);
}

function placeBet(stake) {
  if (state.bets.length === 0) return;
  
  // Check if any match already ended
  const endedBets = state.bets.filter(b => {
    const match = state.matches.find(m => m.id === b.matchId);
    return !match || match.fullTime;
  });
  
  if (endedBets.length > 0) {
    showToast('Error', 'Some matches already ended! Removing them...');
    state.bets = state.bets.filter(b => !endedBets.includes(b));
    updateBetslip();
    return;
  }
  
  const totalOdds = state.bets.reduce((acc, bet) => acc * bet.odds, 1);
  const potentialWin = stake * totalOdds;
  
  state.balance = Math.max(0, state.balance - stake);
  
  const betRecord = {
    id: 'B' + Date.now(),
    date: new Date().toLocaleString(),
    stake: parseFloat(stake),
    odds: totalOdds,
    potentialWin: parseFloat(potentialWin.toFixed(2)),
    selections: state.bets.map(b => ({
      matchId: b.matchId,
      match: b.match,
      selection: b.selection,
      odds: b.odds
    })),
    status: 'pending'
  };
  
  state.history.unshift(betRecord);
  state.vipPoints += Math.floor(stake / 10);
  updateVIP();
  
  // Show receipt
  showReceipt(betRecord);
  
  // Clear current bets
  state.bets = [];
  updateBetslip();
  updateUI();
  saveUser();
  renderMyBets();

function renderMyBets() {
  const container = document.getElementById('myBetsList');
  if (!container) return;
  
  // Get all bets, pending first
  const pendingBets = state.history.filter(b => b.status === 'pending');
  const settledBets = state.history.filter(b => b.status !== 'pending').slice(0, 5);
  
  let html = '';
  
  // PENDING BETS
  if (pendingBets.length > 0) {
    html += '<div style="font-size:.65rem;color:var(--t3);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:1px;font-weight:600;">⏳ Active Bets</div>';
    
    html += pendingBets.map(bet => {
      // Check if matches are live
      const liveMatches = bet.selections.filter(s => {
        const m = state.matches.find(m => m.id === s.matchId);
        return m && m.isLive && !m.fullTime;
      });
      
      const hasLive = liveMatches.length > 0;
      
      // Build selections with live scores
      const selectionsHtml = bet.selections.map(s => {
        const m = state.matches.find(m => m.id === s.matchId);
        if (!m) return `<div style="color:var(--t2);">${s.match} <span style="color:var(--g);">(${s.selection})</span></div>`;
        
        const isWinning = (s.selection === m.home && m.score.home > m.score.away) ||
                         (s.selection === m.away && m.score.away > m.score.home) ||
                         (s.selection === 'Draw' && m.score.home === m.score.away);
        
        const statusIcon = m.fullTime ? (isWinning ? '✅' : '❌') : (isWinning ? '🟢' : '⏳');
        
        return `<div style="margin-bottom:3px;">
          <span style="color:${m.fullTime ? 'var(--t2)' : 'var(--t)'};font-weight:${m.isLive ? '600' : '400'};">
            ${m.home} ${m.score.home}-${m.score.away} ${m.away}
          </span>
          <span style="color:var(--g);font-size:0.7rem;">(${s.selection}) ${statusIcon}</span>
          ${m.isLive ? '<span style="color:var(--red);font-size:0.65rem;margin-left:4px;">● LIVE</span>' : ''}
        </div>`;
      }).join('');
      
      return `
      <div style="background:var(--bg2);border:1px solid ${hasLive ? 'var(--red)' : 'var(--g)'};border-radius:10px;padding:.7rem;margin-bottom:.6rem;font-size:.74rem;animation:${hasLive ? 'pulse-border 2s infinite' : 'none'};">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;">
          <span style="font-weight:700;color:var(--t);">${bet.selections.length} PICK${bet.selections.length > 1 ? 'S' : ''}</span>
          <span style="color:${hasLive ? 'var(--red)' : 'var(--g)'};font-weight:700;font-size:0.75rem;">
            ${hasLive ? '🔴 LIVE' : '⏳ PENDING'}
          </span>
        </div>
        <div style="color:var(--t2);margin-bottom:.4rem;line-height:1.4;">
          ${selectionsHtml}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);padding-top:.4rem;">
          <span style="color:var(--t3);font-size:0.7rem;">Stake: ₦${bet.stake.toFixed(0)}</span>
          <span style="color:var(--green);font-weight:700;font-size:0.9rem;">Win: ₦${bet.potentialWin.toFixed(0)}</span>
        </div>
      </div>
      `;
    }).join('');
  }
  
  // SETTLED BETS (Recent)
  if (settledBets.length > 0) {
    html += '<div style="font-size:.65rem;color:var(--t3);margin:.8rem 0 .5rem;text-transform:uppercase;letter-spacing:1px;font-weight:600;">📊 Recent Results</div>';
    
    html += settledBets.map(bet => {
      const isWon = bet.status === 'won';
      const borderColor = isWon ? 'var(--green)' : 'var(--red)';
      const bgColor = isWon ? 'rgba(34,197,94,0.08)' : 'rgba(239,68,68,0.08)';
      
      return `
      <div style="background:${bgColor};border:1px solid ${borderColor};border-radius:10px;padding:.7rem;margin-bottom:.5rem;font-size:.74rem;opacity:0.9;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem;">
          <span style="font-weight:700;color:var(--t);">${bet.selections.length} PICK${bet.selections.length > 1 ? 'S' : ''}</span>
          <span style="color:${isWon ? 'var(--green)' : 'var(--red)'};font-weight:800;background:${isWon ? 'rgba(34,197,94,0.2)' : 'rgba(239,68,68,0.2)'};padding:3px 10px;border-radius:6px;font-size:0.8rem;">
            ${isWon ? '🎉 WON' : '❌ LOST'}
          </span>
        </div>
        <div style="color:var(--t2);font-size:.7rem;margin-bottom:.3rem;">
          ${bet.selections.map(s => `<div>${s.match} <span style="color:var(--g);">(${s.selection})</span></div>`).join('')}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);padding-top:.4rem;">
          <span style="color:var(--t3);font-size:0.7rem;">@ ${bet.odds.toFixed(2)}</span>
          <span style="color:${isWon ? 'var(--green)' : 'var(--red)'};font-weight:800;font-size:1rem;">
            ${isWon ? '+' : '-'}₦${isWon ? bet.potentialWin.toFixed(2) : bet.stake.toFixed(2)}
          </span>
        </div>
      </div>
      `;
    }).join('');
  }
  
  if (pendingBets.length === 0 && settledBets.length === 0) {
    html = '<p style="font-size:.78rem;color:var(--t3);padding:1rem 0;text-align:center;">No bets yet. Place a bet to see it here!</p>';
  }
  
  container.innerHTML = html;
}

// AVIATOR GAME
// ==========================================
let aviatorInterval;

function toggleAviator() {
  const section = document.getElementById('aviatorSection');
  const main = document.getElementById('mainContent');
  
  if (section.classList.contains('open')) {
    section.classList.remove('open');
    main.style.display = 'block';
    stopAviator();
  } else {
    section.classList.add('open');
    main.style.display = 'none';
    startAviatorRound();
  }
}

function startAviatorRound() {
  if (state.aviator.flying) return;
  
  state.aviator.flying = false;
  state.aviator.crashed = false;
  state.aviator.multiplier = 1.00;
  state.aviator.curve = [];
  state.aviator.bets = [{active: false, amount: 0, cashed: false}, {active: false, amount: 0, cashed: false}];
  
  document.getElementById('avMult').textContent = '1.00x';
  document.getElementById('avMult').classList.remove('crashed');
  document.getElementById('avPlane').classList.remove('flying', 'crashed');
  document.getElementById('avStatus').textContent = 'Starting in 5s...';
  document.getElementById('avPath').setAttribute('d', 'M0,400 L0,400');
  
  [1, 2].forEach(i => {
    document.getElementById(`bet${i}Btn`).style.display = 'block';
    document.getElementById(`bet${i}Btn`).classList.remove('av-btn-cashed', 'av-btn-lost');
    document.getElementById(`bet${i}Btn`).textContent = 'Place Bet';
    document.getElementById(`cash${i}Btn`).classList.remove('show');
    document.getElementById(`bet${i}Amt`).textContent = '₦0.00';
  });
  
  setTimeout(() => {
    if (!document.getElementById('aviatorSection').classList.contains('open')) return;
    launchAviator();
  }, 5000);
}

function launchAviator() {
  state.aviator.flying = true;
  state.aviator.startTime = Date.now();
  document.getElementById('avPlane').classList.add('flying');
  document.getElementById('avStatus').textContent = 'Flying...';
  
  const crashPoint = Math.max(1.01, (Math.random() ** 2) * 10 + 1);
  
  aviatorInterval = setInterval(() => {
    if (!state.aviator.flying) return;
    
    const elapsed = (Date.now() - state.aviator.startTime) / 1000;
    state.aviator.multiplier = Math.max(1.00, (1 + elapsed * 0.15) ** 2 / 10 + 1);
    
    document.getElementById('avMult').textContent = state.aviator.multiplier.toFixed(2) + 'x';
    
    updateAviatorCurve();
    
    [1, 2].forEach(i => {
      if (state.aviator.bets[i-1].active && !state.aviator.bets[i-1].cashed) {
        const autoVal = parseFloat(document.getElementById(`bet${i}AutoVal`).value);
        if (document.getElementById(`bet${i}Auto`).checked && state.aviator.multiplier >= autoVal) {
          cashOutAviator(i);
        }
        document.getElementById(`cash${i}Val`).textContent = (state.aviator.bets[i-1].amount * state.aviator.multiplier).toFixed(2);
      }
    });
    
    if (state.aviator.multiplier >= crashPoint) {
      crashAviator();
    }
  }, 50);
}

function updateAviatorCurve() {
  const height = 400;
  
  state.aviator.curve.push({x: (state.aviator.multiplier - 1) * 100, y: height - (state.aviator.multiplier ** 1.5)});
  
  if (state.aviator.curve.length > 1) {
    const path = 'M0,' + height + ' ' + state.aviator.curve.map(p => 'L' + p.x + ',' + p.y).join(' ');
    document.getElementById('avPath').setAttribute('d', path);
  }
  
  const plane = document.getElementById('avPlane');
  const lastPoint = state.aviator.curve[state.aviator.curve.length - 1];
  if (lastPoint) {
    plane.style.left = (10 + lastPoint.x / 10) + '%';
    plane.style.top = (70 - lastPoint.y / 10) + '%';
  }
}

function placeAviatorBet(betNum) {
  if (state.aviator.flying) return;
  
  const input = document.getElementById(`bet${betNum}Input`);
  const amount = parseFloat(input.value) || 0;
  
  if (amount < 100) {
    showToast('Error', 'Minimum bet is ₦100');
    return;
  }
  if (amount > state.balance) {
    showToast('Error', 'Insufficient balance');
    return;
  }
  
  state.balance = Math.max(0, state.balance - amount);
  state.aviator.bets[betNum-1] = {active: true, amount, cashed: false};
  
  document.getElementById(`bet${betNum}Amt`).textContent = '₦' + amount.toLocaleString();
  document.getElementById(`bet${betNum}Btn`).style.display = 'none';
  document.getElementById(`cash${betNum}Btn`).classList.add('show');
  
  updateUI();
  saveUser();
}

function cashOutAviator(betNum) {
  const bet = state.aviator.bets[betNum-1];
  if (!bet.active || bet.cashed || !state.aviator.flying) return;
  
  bet.cashed = true;
  const win = bet.amount * state.aviator.multiplier;
  state.balance += win;
  
  document.getElementById(`cash${betNum}Btn`).classList.remove('show');
  document.getElementById(`bet${betNum}Btn`).style.display = 'block';
  document.getElementById(`bet${betNum}Btn`).textContent = 'Cashed: ₦' + win.toFixed(2);
  document.getElementById(`bet${betNum}Btn`).classList.add('av-btn-cashed');
  
  updateUI();
  saveUser();
  showToast('🎉 Cashed Out!', `Won ₦${win.toFixed(2)} at ${state.aviator.multiplier.toFixed(2)}x`);
}

function crashAviator() {
  state.aviator.flying = false;
  state.aviator.crashed = true;
  
  clearInterval(aviatorInterval);
  
  document.getElementById('avMult').classList.add('crashed');
  document.getElementById('avPlane').classList.add('crashed');
  document.getElementById('avStatus').textContent = 'Crashed at ' + state.aviator.multiplier.toFixed(2) + 'x';
  
  [1, 2].forEach(i => {
    const bet = state.aviator.bets[i-1];
    if (bet.active && !bet.cashed) {
      document.getElementById(`cash${i}Btn`).classList.remove('show');
      document.getElementById(`bet${i}Btn`).style.display = 'block';
      document.getElementById(`bet${i}Btn`).textContent = 'Lost: ₦' + bet.amount.toFixed(0);
      document.getElementById(`bet${i}Btn`).classList.add('av-btn-lost');
    }
  });
  
  const hash = '0x' + Math.random().toString(16).substr(2, 64);
  document.getElementById('hashVal').textContent = hash.substr(0, 20) + '...';
  
  setTimeout(() => {
    if (document.getElementById('aviatorSection').classList.contains('open')) {
      startAviatorRound();
    }
  }, 3000);
}

function stopAviator() {
  clearInterval(aviatorInterval);
}
